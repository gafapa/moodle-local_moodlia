name: Project documentation Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/project-page.json
      - docs/project-page-assets/**
      - tools/build-project-page.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build documentation portal
        run: python3 tools/build-project-page.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .project-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
