name: Moodle PHPUnit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database: [pgsql, mariadb]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: repository
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: max_input_vars=5000, opcache.enable_cli=1
      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle 5.2 test environment
        run: moodle-plugin-ci install --plugin ./repository --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_502_STABLE
      - name: Lint PHP
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint
      - name: Validate plugin metadata
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate
      - name: Check Moodle coding style
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: Check PHP documentation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Run PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
