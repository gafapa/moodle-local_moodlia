name: Moodle PHPUnit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: MOODLE_405_STABLE
            php: '8.1'
            database: mariadb
          - moodle: MOODLE_405_STABLE
            php: '8.3'
            database: pgsql
          - moodle: MOODLE_500_STABLE
            php: '8.2'
            database: mariadb
          - moodle: MOODLE_500_STABLE
            php: '8.4'
            database: pgsql
          - moodle: MOODLE_501_STABLE
            php: '8.2'
            database: mariadb
          - moodle: MOODLE_501_STABLE
            php: '8.4'
            database: pgsql
          - moodle: MOODLE_502_STABLE
            php: '8.3'
            database: mariadb
          - moodle: MOODLE_502_STABLE
            php: '8.4'
            database: pgsql
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: repository
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: max_input_vars=5000, opcache.enable_cli=1
      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install ${{ matrix.moodle }} test environment
        run: moodle-plugin-ci install --plugin ./repository --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: Lint PHP
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint
      - name: Validate plugin metadata
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate
      - name: Check Moodle coding style
        if: ${{ !cancelled() }}
        run: ./ci/vendor/bin/phpcs --standard=moodle --extensions=php -p -w -s --no-cache --runtime-set ignore_warnings_on_exit 1 ./repository
      - name: Check PHP documentation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Run PHPUnit
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          moodle-plugin-ci phpunit --fail-on-warning 2>&1 | tee phpunit-output.log
          phpunit_status=${PIPESTATUS[0]}
          set -e

          if [[ "$phpunit_status" -ne 0 ]]; then
            annotation="$(tail -n 100 phpunit-output.log)"
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\r'/'%0D'}"
            annotation="${annotation//$'\n'/'%0A'}"
            echo "::error title=PHPUnit failure::$annotation"
          fi

          exit "$phpunit_status"
      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
